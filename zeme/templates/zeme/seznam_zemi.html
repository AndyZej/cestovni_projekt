

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seznam zemí - Cestovatelské radosti</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Fairwater Script';
            src: local('Fairwater Script'), local('FairwaterScript');
            font-display: swap;
        }

        :root {
            --font-script: 'Fairwater Script', 'Charm', cursive;
            --font-sans: 'Montserrat', sans-serif;
            --panel-bg: rgba(30, 35, 45, 0.85);
            --panel-border: rgba(197, 160, 89, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
            --text-color: #ffffff;
            --gold-accent: #c5a059;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            height: 100%;
            font-family: var(--font-sans);
            color: var(--text-color);
            overflow-x: hidden;
            background-color: #fbf9f4;
        }

        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #bg-overlay::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(251, 249, 244, 0.85);
        }

        /* Canvas pro bubliny přesně jako v domovské stránce */
        #bubble-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: auto;
        }

        /* Centrování kontejneru na střed obrazovky */
        .center-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 900px;
            text-align: center;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid var(--gold-accent);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            padding: 40px;
        }

        .main-heading {
            font-family: var(--font-script);
            font-size: 42px;
            line-height: 1.3;
            margin-bottom: 30px;
            color: #4a3b2c;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.08);
        }

        .countries-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
            margin-bottom: 30px;
        }

        .country-card {
            background: rgba(30, 35, 45, 0.9);
            backdrop-filter: blur(12px);
            border: 2px solid var(--gold-accent);
            color: white;
            padding: 20px 25px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 20px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: var(--glass-shadow);
            transition: all 0.3s ease;
            width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .country-card:hover {
            background-color: var(--gold-accent);
            color: #0f172a;
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(197, 160, 89, 0.4);
        }

        .country-card p {
            font-size: 0.8rem;
            opacity: 0.8;
            font-weight: 300;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(30, 35, 45, 0.9);
            border: 1px solid var(--gold-accent);
            color: white;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: var(--glass-shadow);
        }

        .back-btn:hover {
            background-color: var(--gold-accent);
            color: #0f172a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div id="bg-overlay"></div>
    <canvas id="bubble-canvas"></canvas>

    <div class="center-container">
        <h1 class="main-heading">🌍 Seznam navštívených zemí</h1>

        <div class="countries-grid">
            <a href="{% url 'detail_zeme' 'turecko' %}" class="country-card">
                <span>Turecko</span>
                <p>Zobrazit detail</p>
            </a>
            <a href="{% url 'detail_zeme' 'kapverdy' %}" class="country-card">
                <span>Kapverdy</span>
                <p>Zobrazit detail</p>
            </a>
            <a href="{% url 'detail_zeme' 'tunisko' %}" class="country-card">
                <span>Tunisko</span>
                <p>Zobrazit detail</p>
            </a>
            <a href="{% url 'detail_zeme' 'egypt' %}" class="country-card">
                <span>Egypt</span>
                <p>Zobrazit detail</p>
            </a>
        </div>

        <div>
            <a href="{% url 'domov' %}" class="back-btn">← Zpět na hlavní stránku</a>
        </div>
    </div>

    <!-- Skript pro animaci bublin -->
    <script>
        const canvas = document.getElementById('bubble-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
        });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const lightPalettes = [
            { min: 35, max: 50 },
            { min: 40, max: 55 },
            { min: 30, max: 45 }
        ];

        let baseHue = lightPalettes[0];

        class Bubble {
            constructor(x, y, radius) {
                this.x = x || Math.random() * width;
                this.y = y || height + (Math.random() * 100);
                this.radius = radius || Math.random() * 35 + 10;
                this.baseRadius = this.radius;

                this.vy = -(Math.random() * 0.6 + 0.3);
                this.vx = (Math.random() - 0.5) * 0.4;

                this.updateColor();

                this.angle = Math.random() * Math.PI * 2;
                this.swingSpeed = Math.random() * 0.02 + 0.005;
                this.swingMagnitude = Math.random() * 0.8 + 0.2;
            }

            updateColor() {
                const hue = Math.floor(Math.random() * (baseHue.max - baseHue.min) + baseHue.min);
                const opacity = Math.random() * 0.25 + 0.10;
                this.color = `hsla(${hue}, 60%, 75%, ${opacity})`;
                this.borderColor = `hsla(${hue}, 70%, 85%, ${opacity + 0.2})`;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

                const gradient = ctx.createRadialGradient(
                    this.x - this.radius * 0.3,
                    this.y - this.radius * 0.3,
                    this.radius * 0.1,
                    this.x,
                    this.y,
                    this.radius
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
                gradient.addColorStop(0.4, this.color);
                gradient.addColorStop(1, 'rgba(197, 160, 89, 0.05)');

                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.lineWidth = 1;
                ctx.strokeStyle = this.borderColor;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(
                    this.x - this.radius * 0.3,
                    this.y - this.radius * 0.3,
                    this.radius * 0.3,
                    Math.PI * 1.2,
                    Math.PI * 1.7
                );
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = Math.max(1, this.radius * 0.08);
                ctx.stroke();

                ctx.restore();
            }

            update() {
                this.angle += this.swingSpeed;
                this.x += Math.sin(this.angle) * this.swingMagnitude + this.vx;
                this.y += this.vy;

                if (mouse.x !== null && mouse.y !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        const force = (mouse.radius - distance) / mouse.radius;
                        if (this.radius < this.baseRadius * 1.4) {
                            this.radius += 0.8;
                        }
                        this.x -= (dx / distance) * force * 1.5;
                        this.y -= (dy / distance) * force * 1.5;
                    } else if (this.radius > this.baseRadius) {
                        this.radius -= 0.3;
                    }
                } else if (this.radius > this.baseRadius) {
                    this.radius -= 0.3;
                }

                if (this.y + this.radius < -20) {
                    this.y = height + this.radius + Math.random() * 20;
                    this.x = Math.random() * width;
                    this.updateColor();
                }

                if (this.x < -this.radius) this.x = width + this.radius;
                if (this.x > width + this.radius) this.x = -this.radius;

                this.draw();
            }
        }

        const bubbles = [];
        const bubbleCount = Math.min(Math.floor(window.innerWidth / 20), 45);

        for (let i = 0; i < bubbleCount; i++) {
            const bubble = new Bubble();
            bubble.y = Math.random() * height;
            bubbles.push(bubble);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < bubbles.length; i++) {
                bubbles[i].update();
            }
            requestAnimationFrame(animate);
        }

        animate();

        canvas.addEventListener('click', (e) => {
            bubbles.push(new Bubble(e.clientX, e.clientY, Math.random() * 30 + 15));
        });
    </script>
</body>
</html>
