


<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cestovatelské radosti - Komunity{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold-accent: #c5a059;
            --gold-light: #dfc285;
            --glass-bg: rgba(255, 255, 255, 0.90);
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            color: #2c3e50;
            overflow: hidden;
            background: linear-gradient(135deg, #fdfbf7 0%, #f4ebd0 100%);
        }

        .font-charm {
            font-family: 'Charm', cursive;
        }

        /* Plátno pro interaktivní bubliny na pozadí */
        #bubble-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: auto;
        }

        .page-wrapper {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            max-width: 1250px;
            margin: 0 auto;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--gold-accent);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--gold-accent);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(197, 160, 89, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(197, 160, 89, 0.25);
        }

        .chat-container {
            background: #efeae2;
            background-image: radial-gradient(#d1dbd6 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--gold-accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-bubble-in {
            background: #ffffff;
            border-radius: 0 16px 16px 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 1rem;
        }

        .chat-bubble-out {
            background: #dcf8c6;
            border-radius: 16px 0 16px 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 1rem;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="relative">

    <!-- Canvas pro animované bubliny na pozadí -->
    <canvas id="bubble-canvas"></canvas>

    <div class="page-wrapper">

        <!-- Tlačítko Zpět domů v pravém horním rohu -->
        <div class="w-full max-w-[1250px] flex justify-end mb-2 pr-2 z-20">
            <a href="{% url 'domovsky' %}" class="text-sm sm:text-base font-semibold text-black hover:underline flex items-center gap-1.5 bg-white/90 px-4 py-2 rounded-full border border-[#c5a059]/50 shadow-md transition-all hover:bg-white">
                <i class="fa-solid fa-arrow-left"></i> Zpět domů
            </a>
        </div>

        <!-- Hlavní obsah šablony -->
        {% block content_main %}{% endblock %}

    </div>

    <!-- JAVASCRIPT pro plovoucí bubliny na pozadí -->
    <script>
        const canvas = document.getElementById('bubble-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
        });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Bubble {
            constructor(x, y, radius) {
                this.x = x || Math.random() * width;
                this.y = y || height + (Math.random() * 100);
                this.radius = radius || Math.random() * 35 + 10;
                this.baseRadius = this.radius;

                this.vy = -(Math.random() * 0.6 + 0.3);
                this.vx = (Math.random() - 0.5) * 0.4;

                this.updateColor();

                this.angle = Math.random() * Math.PI * 2;
                this.swingSpeed = Math.random() * 0.02 + 0.005;
                this.swingMagnitude = Math.random() * 0.8 + 0.2;
            }

            updateColor() {
                const hue = Math.floor(Math.random() * 20 + 35);
                const opacity = Math.random() * 0.25 + 0.10;
                this.color = `hsla(${hue}, 60%, 75%, ${opacity})`;
                this.borderColor = `hsla(${hue}, 70%, 85%, ${opacity + 0.2})`;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

                const gradient = ctx.createRadialGradient(
                    this.x - this.radius * 0.3,
                    this.y - this.radius * 0.3,
                    this.radius * 0.1,
                    this.x,
                    this.y,
                    this.radius
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
                gradient.addColorStop(0.4, this.color);
                gradient.addColorStop(1, 'rgba(197, 160, 89, 0.05)');

                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.lineWidth = 1;
                ctx.strokeStyle = this.borderColor;
                ctx.stroke();

                ctx.restore();
            }

            update() {
                this.angle += this.swingSpeed;
                this.x += Math.sin(this.angle) * this.swingMagnitude + this.vx;
                this.y += this.vy;

                if (mouse.x !== null && mouse.y !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        const force = (mouse.radius - distance) / mouse.radius;
                        if (this.radius < this.baseRadius * 1.4) {
                            this.radius += 0.8;
                        }
                        this.x -= (dx / distance) * force * 1.5;
                        this.y -= (dy / distance) * force * 1.5;
                    } else if (this.radius > this.baseRadius) {
                        this.radius -= 0.3;
                    }
                } else if (this.radius > this.baseRadius) {
                    this.radius -= 0.3;
                }

                if (this.y + this.radius < -20) {
                    this.y = height + this.radius + Math.random() * 20;
                    this.x = Math.random() * width;
                    this.updateColor();
                }

                if (this.x < -this.radius) this.x = width + this.radius;
                if (this.x > width + this.radius) this.x = -this.radius;

                this.draw();
            }
        }

        const bubbles = [];
        const bubbleCount = Math.min(Math.floor(window.innerWidth / 20), 45);

        for (let i = 0; i < bubbleCount; i++) {
            const bubble = new Bubble();
            bubble.y = Math.random() * height;
            bubbles.push(bubble);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < bubbles.length; i++) {
                bubbles[i].update();
            }
            requestAnimationFrame(animate);
        }

        animate();

        canvas.addEventListener('click', (e) => {
            bubbles.push(new Bubble(e.clientX, e.clientY, Math.random() * 30 + 15));
        });
    </script>
</body>
</html>
