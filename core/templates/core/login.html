

<form method="POST" class="login-form">
    {% csrf_token %}

    {% if form.errors %}
        <div class="alert-error">
            Nesprávné uživatelské jméno nebo heslo. Zkuste to prosím znovu.
        </div>
    {% endif %}

    <div class="form-group">
        <label for="id_username">Uživatelské jméno</label>
        <input type="text" name="username" id="id_username" placeholder="Zadejte uživatelské jméno" required>
    </div>

    <div class="form-group">
        <label for="id_password">Heslo</label>
        <input type="password" name="password" id="id_password" placeholder="Zadejte heslo" required>
    </div>

    <div class="form-actions-row">
        <label class="remember-me">
            <input type="checkbox" name="remember"> Zapamatovat si mě
        </label>
        <a href="#" class="forgot-password">Zapomněli jste heslo?</a>
    </div>

    <button type="submit" class="btn-submit">Přihlásit se</button>
</form>
